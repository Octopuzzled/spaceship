<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
    <!-- Schiff leicht verkleinert, damit die Kugel ganz herumpasst -->
    <g transform="translate(185 140) scale(0.82) translate(-185 -140)">
    <defs>
        <linearGradient id="potato" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f0cf8a"/>
            <stop offset="1" stop-color="#b8843f"/>
        </linearGradient>
        <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a77bff"/>
            <stop offset="1" stop-color="#4a2a9e"/>
        </linearGradient>
        <radialGradient id="glass" cx="0.35" cy="0.3" r="0.8">
            <stop offset="0" stop-color="#c9f4ff"/>
            <stop offset="1" stop-color="#2a8fb8"/>
        </radialGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe27a"/>
            <stop offset="1" stop-color="#d49a1a"/>
        </linearGradient>
    </defs>

    <!-- Flamme -->
    <g>
        <polygon fill="#ff7a2f" points="95,140 40,120 62,140 40,160">
            <animate attributeName="points"
                     values="95,140 40,120 62,140 40,160;95,140 22,126 56,140 22,154;95,140 40,120 62,140 40,160"
                     dur="0.3s" repeatCount="indefinite"/>
        </polygon>
        <polygon fill="#ffd23f" points="95,140 62,130 76,140 62,150">
            <animate attributeName="points"
                     values="95,140 62,130 76,140 62,150;95,140 52,134 72,140 52,146;95,140 62,130 76,140 62,150"
                     dur="0.3s" repeatCount="indefinite"/>
        </polygon>
    </g>

    <!-- Flügel -->
    <path d="M170 95 L120 30 L215 78 Z" fill="url(#wing)" stroke="#2a1560" stroke-width="3" stroke-linejoin="round"/>
    <path d="M170 185 L120 250 L215 202 Z" fill="url(#wing)" stroke="#2a1560" stroke-width="3" stroke-linejoin="round"/>

    <!-- Kartoffel-Rumpf -->
    <g transform="rotate(-6 210 140)">
        <path d="M100 150 C90 100 140 68 215 70 C300 70 335 105 325 148 C318 190 270 215 205 212 C140 210 108 190 100 150 Z"
              fill="url(#potato)" stroke="#6b4518" stroke-width="4"/>
        <ellipse cx="150" cy="115" rx="9" ry="6" fill="#8a5a22" opacity="0.6"/>
        <ellipse cx="185" cy="178" rx="11" ry="7" fill="#8a5a22" opacity="0.6"/>
        <ellipse cx="290" cy="185" rx="8" ry="5" fill="#8a5a22" opacity="0.6"/>
        <ellipse cx="135" cy="155" rx="6" ry="4" fill="#8a5a22" opacity="0.6"/>
        <ellipse cx="225" cy="100" rx="7" ry="4" fill="#8a5a22" opacity="0.5"/>
    </g>

    <!-- Fenster -->
    <circle cx="250" cy="138" r="32" fill="#2b2250" stroke="#6b4518" stroke-width="4"/>
    <circle cx="250" cy="138" r="25" fill="url(#glass)"/>
    <ellipse cx="241" cy="129" rx="7" ry="4" fill="#ffffff" opacity="0.7" transform="rotate(-30 241 129)"/>

    <!-- Krone -->
    <polygon points="190,76 190,44 206,60 222,36 238,60 254,44 254,80"
             fill="url(#gold)" stroke="#8a5f08" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="190" cy="44" r="5" fill="#ff4d6d"/>
    <circle cx="222" cy="36" r="5" fill="#4cc9f0"/>
    <circle cx="254" cy="44" r="5" fill="#ff4d6d"/>
</g>

    <!-- ===== Schutzschild ===== -->
    <defs>
        <radialGradient id="shield-fill" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0.6" stop-color="#4cc9f0" stop-opacity="0"/>
            <stop offset="0.9" stop-color="#4cc9f0" stop-opacity="0.18"/>
            <stop offset="1" stop-color="#9be7ff" stop-opacity="0.45"/>
        </radialGradient>
        <filter id="shield-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <clipPath id="shield-clip"><ellipse cx="190" cy="138" rx="184" ry="120"/></clipPath>
    </defs>

    <g filter="url(#shield-glow)">
        <ellipse cx="190" cy="138" rx="184" ry="120" fill="url(#shield-fill)" stroke="#7fdcff" stroke-width="3">
            <animate attributeName="stroke-opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
        </ellipse>
    </g>

    <!-- Gitterlinien wie bei einer Energiekugel -->
    <g clip-path="url(#shield-clip)" fill="none" stroke="#9be7ff" stroke-width="1" opacity="0.28">
        <ellipse cx="190" cy="138" rx="64" ry="120"/>
        <ellipse cx="190" cy="138" rx="128" ry="120"/>
        <ellipse cx="190" cy="138" rx="184" ry="40"/>
        <ellipse cx="190" cy="138" rx="184" ry="80"/>
        <line x1="6" y1="138" x2="374" y2="138"/>
        <line x1="190" y1="18" x2="190" y2="258"/>
    </g>

    <!-- Glanzlicht, wandert langsam über die Kugel -->
    <g clip-path="url(#shield-clip)">
        <path d="M70 78 C90 48 140 30 190 28" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.55">
            <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.4s" repeatCount="indefinite"/>
        </path>
        <ellipse cx="94" cy="92" rx="5" ry="3" fill="#ffffff" opacity="0.7" transform="rotate(-35 94 92)"/>
    </g>

    <!-- kleine Energiefunken auf der Hülle -->
    <g fill="#d6f6ff">
        <circle cx="352" cy="96" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/></circle>
        <circle cx="318" cy="206" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.6s" repeatCount="indefinite"/></circle>
        <circle cx="60" cy="196" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.1s" repeatCount="indefinite"/></circle>
    </g>
</svg>

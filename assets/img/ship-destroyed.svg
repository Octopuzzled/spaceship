<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
    <defs>
        <linearGradient id="burnt" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#a38457"/>
            <stop offset="0.6" stop-color="#6b5033"/>
            <stop offset="1" stop-color="#2e2116"/>
        </linearGradient>
        <linearGradient id="wing-dead" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6a5a8e"/>
            <stop offset="1" stop-color="#2a2145"/>
        </linearGradient>
        <linearGradient id="gold-dead" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c9ad55"/>
            <stop offset="1" stop-color="#7d5f12"/>
        </linearGradient>
        <radialGradient id="glass-dead" cx="0.4" cy="0.35" r="0.8">
            <stop offset="0" stop-color="#3b4a63"/>
            <stop offset="1" stop-color="#12182a"/>
        </radialGradient>
        <clipPath id="half-left">
            <polygon points="0,0 222,0 222,62 206,95 228,120 204,150 226,180 208,220 208,260 0,260"/>
        </clipPath>
        <clipPath id="half-right">
            <polygon points="222,0 400,0 400,260 208,260 208,220 226,180 204,150 228,120 206,95 222,62"/>
        </clipPath>
        <g id="body">
            <g transform="rotate(-6 210 140)">
                <path d="M100 150 C90 100 140 68 215 70 C300 70 335 105 325 148 C318 190 270 215 205 212 C140 210 108 190 100 150 Z"
                      fill="url(#burnt)" stroke="#3a2610" stroke-width="4"/>
                <ellipse cx="150" cy="115" rx="9" ry="6" fill="#2e2116" opacity="0.7"/>
                <ellipse cx="185" cy="178" rx="11" ry="7" fill="#2e2116" opacity="0.7"/>
                <ellipse cx="290" cy="185" rx="8" ry="5" fill="#2e2116" opacity="0.7"/>
                <ellipse cx="135" cy="155" rx="6" ry="4" fill="#2e2116" opacity="0.7"/>
                <ellipse cx="270" cy="105" rx="18" ry="10" fill="#1a1109" opacity="0.45"/>
                <ellipse cx="165" cy="190" rx="22" ry="10" fill="#1a1109" opacity="0.45"/>
            </g>
        </g>
    </defs>

    <!-- Unterer Flügel: abgebrochen -->
    <path d="M170 185 L146 214 L160 222 L140 246 L172 232 L196 205 Z"
          fill="url(#wing-dead)" stroke="#1c1433" stroke-width="3" stroke-linejoin="round"/>
    <!-- abgerissenes Flügelstück, treibt weg -->
    <g>
        <path d="M120 240 L96 252 L112 256 L128 248 Z" fill="url(#wing-dead)" stroke="#1c1433" stroke-width="3" stroke-linejoin="round"/>
        <animateTransform attributeName="transform" type="rotate" values="0 112 248;18 112 248;0 112 248" dur="5s" repeatCount="indefinite"/>
    </g>

    <!-- Oberer Flügel: verkohlt, angeknackst -->
    <path d="M170 95 L120 30 L168 54 L158 64 L192 74 Z"
          fill="url(#wing-dead)" stroke="#1c1433" stroke-width="3" stroke-linejoin="round"/>

    <!-- Rumpf, in zwei Hälften zerbrochen -->
    <g transform="translate(-10 6) rotate(-5 150 140)">
        <g clip-path="url(#half-left)"><use href="#body"/></g>
    </g>
    <g transform="translate(10 -3) rotate(4 270 140)">
        <g clip-path="url(#half-right)"><use href="#body"/></g>
        <!-- Fenster mit Sprüngen -->
        <circle cx="262" cy="138" r="32" fill="#1c1630" stroke="#3a2610" stroke-width="4"/>
        <circle cx="262" cy="138" r="25" fill="url(#glass-dead)"/>
        <g stroke="#8fb7d6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85">
            <polyline points="262,113 258,128 266,138 256,152 262,163"/>
            <polyline points="240,130 255,134 266,138 282,132 288,126"/>
            <polyline points="266,138 278,150 284,158"/>
        </g>
    </g>

    <!-- Funken am Riss -->
    <g>
        <g stroke="#ffd23f" stroke-width="2.5" stroke-linecap="round">
            <line x1="214" y1="92" x2="208" y2="82"/>
            <line x1="226" y1="150" x2="236" y2="146"/>
            <line x1="204" y1="176" x2="196" y2="184"/>
        </g>
        <animate attributeName="opacity" values="1;0.1;1;0.3;1" dur="1.1s" repeatCount="indefinite"/>
    </g>
    <g fill="#ff7a2f">
        <circle cx="219" cy="120" r="3"><animate attributeName="opacity" values="1;0;1" dur="0.7s" repeatCount="indefinite"/></circle>
        <circle cx="212" cy="200" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="0.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Krone: abgefallen und schief -->
    <g transform="translate(80 -6) rotate(34 222 60)">
        <polygon points="190,76 190,44 206,60 222,36 238,60 254,44 254,80"
                 fill="url(#gold-dead)" stroke="#5d4308" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="190" cy="44" r="5" fill="#7a2a3a"/>
        <circle cx="222" cy="36" r="5" fill="#2d6a80"/>
        <circle cx="254" cy="44" r="5" fill="#7a2a3a"/>
    </g>

    <!-- Rauch -->
    <g fill="#8d879f">
        <circle cx="200" cy="90" r="10" opacity="0.5">
            <animate attributeName="cy" values="90;30" dur="3s" repeatCount="indefinite"/>
            <animate attributeName="r" values="8;22" dur="3s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.55;0" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="228" cy="100" r="10" opacity="0.5">
            <animate attributeName="cy" values="100;38" dur="3.8s" begin="1s" repeatCount="indefinite"/>
            <animate attributeName="r" values="8;24" dur="3.8s" begin="1s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.5;0" dur="3.8s" begin="1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="170" cy="110" r="10" opacity="0.5">
            <animate attributeName="cy" values="110;50" dur="3.4s" begin="2s" repeatCount="indefinite"/>
            <animate attributeName="r" values="7;20" dur="3.4s" begin="2s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.45;0" dur="3.4s" begin="2s" repeatCount="indefinite"/>
        </circle>
    </g>
</svg>

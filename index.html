<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Spaceship Control</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <div class="layout">
            <!-- ===== Navigation links: all Buttons ===== -->
            <nav class="nav" aria-label="Schiffssteuerung">
                <div class="nav__brand">
                    <p class="nav__tag">Boardsystem online</p>
                    <h1 class="nav__title">Spaceship<br />Control</h1>
                </div>
                <button
                    class="btn btn--restart"
                    id="restart-button"
                    type="button"
                    onclick="restart()"
                    hidden
                >
                    Start again
                </button>

                <div class="nav__group">
                    <h2 class="nav__heading">Ship status</h2>
                    <button
                        class="btn btn--info"
                        id="status-button"
                        type="button"
                        onclick="renderStatus()"
                    >
                        <img
                            class="btn__icon"
                            src="assets/img/icon-status.svg"
                            alt=""
                            width="28"
                            height="28"
                        />
                        Get ship status
                    </button>
                </div>

                <div class="nav__group">
                    <h2 class="nav__heading">Inventory</h2>
                    <ul id="inventory-list" class="nav__inventory"></ul>
                </div>

                <div class="nav__group">
                    <h2 class="nav__heading">Repairshop</h2>
                    <div class="field-row">
                        <input
                            class="field__input field__input--buy"
                            type="number"
                            id="nav-repairkit-input"
                            min="1"
                            value="1"
                            aria-label="Amount"
                        />
                        <button
                            class="btn btn--buy"
                            id="buy-repairkit-button"
                            type="button"
                            onclick="buyRepairkit()"
                        >
                            <img
                                class="btn__icon"
                                src="assets/img/icon-buy.svg"
                                alt=""
                                width="28"
                                height="28"
                            />
                            Buy repairkits
                        </button>
                    </div>
                    <button
                        class="btn btn--repair"
                        id="repair-repairkit-button"
                        type="button"
                        onclick="useRepairkit()"
                    >
                        <img
                            class="btn__icon"
                            src="assets/img/icon-repair.svg"
                            alt=""
                            width="28"
                            height="28"
                        />
                        Use a repairkit
                    </button>
                    <div class="field-row">
                    <input
                        class="field__input field__input--buy"
                        type="number"
                        id="nav-shield-input"
                        min="1"
                        value="1"
                        aria-label="Amount"
                    />
                    <button
                        class="btn btn--buy"
                        id="buy-shield-button"
                        type="button"
                        onclick="buyShield()"
                    >
                        <img
                            class="btn__icon"
                            src="assets/img/icon-buy.svg"
                            alt=""
                            width="28"
                            height="28"
                        />
                        Buy shields
                    </button>
                    </div>
                    <button
                        class="btn btn--repair"
                        id="repair-shield-button"
                        type="button"
                        onclick="useShield()"
                    >
                        <img
                            class="btn__icon"
                            src="assets/img/icon-repair.svg"
                            alt=""
                            width="28"
                            height="28"
                        />
                        Use a shield
                    </button>
                </div>

                <div class="nav__group nav__group--danger">
                    <h2 class="nav__heading">Danger zone</h2>

                    <div class="field-row">
                    <input
                        class="field__input field__input--hit"
                        type="number"
                        name=""
                        id="nav-hitpoint-input"
                        min="1"
                        value="10"
                        aria-label="Amount"
                    />
                    <button
                        class="btn btn--hit"
                        id="hit-button"
                        type="button"
                        onclick="gettingHit()"
                    >
                        <img
                            class="btn__icon"
                            src="assets/img/icon-hit.svg"
                            alt=""
                            width="28"
                            height="28"
                        />
                        Get hit
                    </button>
                    </div>
                </div>
            </nav>

            <!-- ===== Ship section ===== -->
            <main class="stage">
                <header class="stage__header">
                    <p class="stage__subtitle">
                        Manuver the Potatoqueen using the buttons.
                    </p>
                </header>

                <div class="stage__ship">
                    <img
                        class="stage__ship-img"
                        id="ship-image"
                        src="assets/img/ship.svg"
                        alt="Die Potatoqueen, ein Raumschiff in Kartoffelform mit Krone"
                        width="400"
                        height="260"
                    />
                </div>

                <div class="life" id="life">
                    <img
                        class="life__icon"
                        src="assets/img/icon-life.svg"
                        alt=""
                        width="24"
                        height="24"
                    />
                    <div class="life__bar">
                        <div class="life__fill"></div>
                    </div>
                    <span class="life__value" id="life-value">100</span>
                </div>

                <!-- Messages / Effects -->
                <section class="terminal" aria-label="Bordterminal">
                    <div class="terminal__bar">
                        <span class="terminal__dot terminal__dot--red"></span>
                        <span
                            class="terminal__dot terminal__dot--yellow"
                        ></span>
                        <span class="terminal__dot terminal__dot--green"></span>
                        <span class="terminal__title">potatoqueen@board:~</span>
                        <button
                            class="terminal__clear"
                            type="button"
                            onclick="terminalClear()"
                        >
                            clear
                        </button>
                    </div>
                    <div
                        class="terminal__output"
                        id="terminal-output"
                        role="log"
                        aria-live="polite"
                    ></div>
                </section>
            </main>
        </div>

        <script src="./js/game.js"></script>
        <script src="./js/ship-logic.js"></script>
    </body>
</html>
